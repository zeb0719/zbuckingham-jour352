<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pangolin Poaching & Trafficking Data Visualization</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5" style="max-width: 850px;">
    <h1 class="mb-3">Tracing the Global Pangolin Trafficking Network</h1>
    <p class="lead mb-5">Using genomic analysis of confiscated scales, researchers mapped where white-bellied pangolins are poached and how trafficking routes shifted between 2012 and 2018.</p>

    <!-- Graphic 1: Map -->
    <section class="mb-5">
      <iframe title="DNA Tracing Pinpoints Central Africa as the Epicenter of Pangolin Poaching" aria-label="Symbol map" id="datawrapper-chart-DuEUq" src="https://datawrapper.dwcdn.net/DuEUq/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="486" data-external="1"></iframe><script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
    </section>

    <!-- Graphic 2: Stacked Column Chart -->
    <section class="mb-5">
      <iframe title="Hong Kong Seizures of Trafficked Pangolin Scales Surged in 2017–2018" aria-label="Stacked column chart" id="datawrapper-chart-gnS6m" src="https://datawrapper.dwcdn.net/gnS6m/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="498" data-external="1"></iframe><script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
    </section>
  </div>
</body>
</html>
